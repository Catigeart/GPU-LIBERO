name: Source and CPU checks
'on':
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MUJOCO_GL: disable
      CUDA_VISIBLE_DEVICES: ''
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: tools/requirements-ci.txt
      - run: python -m pip install -r tools/requirements-ci.txt
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: python tools/check_source.py --cpu-tests
      - run: python tools/release/build.py --output-dir dist
